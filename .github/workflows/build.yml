name: Create new release

on:
  push:
    branches:
      - "**"
    tags:
      - "!**"

jobs:
  build:
    name: Build
    runs-on: ubuntu-22.04
    #runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
    - name: Install fuse and libfuse2
      run: sudo apt install fuse libfuse2

    - name: Get appimagetool
      run: |
        set -x
        version_go_appimage=$(wget -q -O - https://api.github.com/repos/probonopd/go-appimage/releases | grep "\"name.*appimagetool-.*-x86_64.AppImage\"" | head -n 1 | cut -d '-' -f2)
        echo "version_go_appimage: $version_go_appimage"
        wget -q "https://github.com/probonopd/go-appimage/releases/download/continuous/appimagetool-$version_go_appimage-x86_64.AppImage" -O appimagetool-x86_64.AppImage
        chmod +x appimagetool-x86_64.AppImage
        pwd; ls -lah

    - name: Make AppImage
      run: |
        set -x
        version=$(grep -o "witr:.*" README.md | cut -d ' ' -f2)
        echo "witr version: $version"

        mkdir squashfs-root/
        cd squashfs-root/

        wget -q https://github.com/pranshuparmar/witr/releases/download/v$version/witr-linux-amd64
        chmod +x witr-linux-amd64
        wget -q https://github.com/ryuuzaki42/witr_AppImage/releases/download/main-00000000/witr.jpg -O witr.png # Not png file, but works
        pwd; ls -lah

        echo '[Desktop Entry]
        Type=Application
        Name=witr
        Exec=witr
        Comment=Why is this running?
        Icon=witr
        Categories=Utility
        Terminal=true' > witr.desktop
        chmod +x witr.desktop
        cat witr.desktop

        echo '#!/bin/bash
        HERE="$(dirname "$(readlink -f "${0}")")"
        echo -e "\nParameters: $@\n"

        $HERE/witr-linux-amd64 $@
        echo' > AppRun
        chmod +x AppRun
        cat AppRun

        cd ../
        cp README.md squashfs-root/
        ls -lah squashfs-root/

        ARCH=x86_64 VERSION="${version}-1_JB" ./appimagetool-x86_64.AppImage squashfs-root/
        pwd; ls -lah

        fileName=$(ls witr*.AppImage)
        echo "fileName: $fileName"
        md5sum "$fileName" > "${fileName}.md5"
        pwd; ls -lah

    - uses: xresloader/upload-to-github-release@v1
      env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
          file: "witr*.AppImage; witr*.zsync; witr*.md5"
          #overwrite: true
          verbose: true
          draft: false
          default_release_name: "witr V in AppImage"
